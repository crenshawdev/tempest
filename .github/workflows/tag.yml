# Thin caller: a `v*` tag push runs the reusable release workflow, producing
# the .deb, .rpm, and signed OSTree Flatpak repo from a single run. A manual
# dispatch can rebuild an existing tag without manufacturing a new release.
#
# A reusable workflow's GITHUB_TOKEN cannot be elevated above the caller's, so
# this caller declares the full permission set explicitly. Without it, a repo
# whose default workflow permissions are read-only would 403 on release
# creation and fail the Pages deploy.
name: tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild and redeploy
        required: true
        type: string

concurrency:
  group: tempest-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit
